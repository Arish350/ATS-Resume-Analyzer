
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ATS Resume Analyzer</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
            color: #e2e8f0;
            background:
                radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.25), transparent 30%),
                radial-gradient(circle at 90% 80%, rgba(124, 58, 237, 0.25), transparent 30%),
                #020617;
            overflow-x: hidden;
        }

        /* Animated background */
        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.25;
            z-index: -1;
            animation: float 8s ease-in-out infinite alternate;
        }

        body::before {
            background: #2563eb;
            top: -100px;
            left: -100px;
        }

        body::after {
            background: #9333ea;
            bottom: -100px;
            right: -100px;
            animation-delay: 2s;
        }

        @keyframes float {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(80px, 50px);
            }
        }

        /* Main Card */
        .container {
            max-width: 760px;
            margin: auto;
            padding: 35px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 24px;

            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(18px);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45),
                inset 0 1px rgba(255, 255, 255, 0.08);

            animation: cardEntry 0.8s ease;
        }

        @keyframes cardEntry {
            from {
                opacity: 0;
                transform: translateY(35px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Heading */
        h1 {
            text-align: center;
            font-size: 38px;
            margin-bottom: 10px;

            background: linear-gradient(
                90deg,
                #60a5fa,
                #a78bfa,
                #22d3ee
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: titleGlow 3s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            from {
                filter: drop-shadow(0 0 5px rgba(96, 165, 250, 0.2));
            }

            to {
                filter: drop-shadow(0 0 15px rgba(167, 139, 250, 0.5));
            }
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 32px;
            font-size: 15px;
        }

        /* Labels */
        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-weight: 600;
            font-size: 14px;
        }

        /* Inputs */
        input,
        textarea {
            width: 100%;
            padding: 14px 15px;

            color: #f8fafc;
            background: rgba(15, 23, 42, 0.8);

            border: 1px solid #334155;
            border-radius: 10px;

            font-size: 15px;
            outline: none;

            transition: all 0.3s ease;
        }

        input::placeholder,
        textarea::placeholder {
            color: #64748b;
        }

        input:focus,
        textarea:focus {
            border-color: #60a5fa;

            box-shadow:
                0 0 0 3px rgba(96, 165, 250, 0.12),
                0 0 20px rgba(37, 99, 235, 0.15);

            transform: translateY(-2px);
        }

        textarea {
            min-height: 160px;
            resize: vertical;
            line-height: 1.6;
        }

        /* File Input */
        input[type="file"] {
            padding: 12px;
            cursor: pointer;
        }

        input[type="file"]::file-selector-button {
            border: none;
            padding: 9px 14px;
            margin-right: 10px;

            border-radius: 7px;

            background: #1e40af;
            color: white;

            cursor: pointer;
            transition: 0.3s;
        }

        input[type="file"]::file-selector-button:hover {
            background: #2563eb;
        }

        /* Button */
        button {
            position: relative;
            width: 100%;
            margin-top: 28px;
            padding: 15px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(
                90deg,
                #2563eb,
                #7c3aed
            );

            color: white;
            font-size: 16px;
            font-weight: 600;

            cursor: pointer;
            overflow: hidden;

            transition: all 0.3s ease;

            box-shadow:
                0 8px 25px rgba(37, 99, 235, 0.25);
        }

        button::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.25),
                transparent
            );

            transition: 0.6s;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 35px rgba(124, 58, 237, 0.35);
        }

        button:active {
            transform: translateY(0);
        }

        /* Result */
        .result {
            margin-top: 35px;
            padding: 25px;

            background: rgba(2, 6, 23, 0.6);

            border: 1px solid rgba(96, 165, 250, 0.15);
            border-radius: 16px;

            animation: resultEntry 1s ease;
        }

        @keyframes resultEntry {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result h2 {
            margin-bottom: 20px;
            color: #f8fafc;
            font-size: 22px;
        }

        .result p {
            margin: 12px 0;
            padding: 13px;

            background: rgba(30, 41, 59, 0.65);
            border-radius: 9px;

            color: #cbd5e1;
        }

        .result strong {
            color: #93c5fd;
        }

        #score,
        #matched,
        #missing {
            color: #f8fafc;
        }

        /* Responsive */
        @media (max-width: 600px) {

            body {
                padding: 20px 12px;
            }

            .container {
                padding: 24px 18px;
                border-radius: 18px;
            }

            h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>ATS Resume Analyzer</h1>

        <p class="subtitle">
            Analyze your resume and compare it with a job description
        </p>

        <form action="/analyze" method="POST" enctype="multipart/form-data">

            <!-- Name -->
            <label for="name">Full Name</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
            >


            <!-- Email -->
            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <!-- Phone -->
            <label for="phone">Phone Number</label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                required
            >


            <!-- Resume -->
            <label for="resume">Upload Resume (PDF)</label>

            <input
                type="file"
                id="resume"
                name="resume"
                accept=".pdf"
                required
            >


            <!-- Job Description -->
            <label for="job_description">Job Description</label>

            <textarea
                id="job_description"
                name="job_description"
                placeholder="Paste the job description here..."
                required
            ></textarea>


            <!-- Analyze Button -->
            <button type="submit">
                Analyze Resume
            </button>

        </form>


        <!-- ATS Result -->

        <div class="result">

            <h2>📊 ATS Analysis Result</h2>

            <p>
                <strong>ATS Score:</strong>
                <span id="score">--</span>
            </p>

            <p>
                <strong>Matched Skills:</strong>
                <span id="matched">--</span>
            </p>

            <p>
                <strong>Missing Skills:</strong>
                <span id="missing">--</span>
            </p>

        </div>

    </div>

</body>
</html>
```
